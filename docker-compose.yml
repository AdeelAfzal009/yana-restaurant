services:
  db:
    # Same major version as the live database (Railway), so its data can be
    # copied down with npm run sync.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=yana
    ports:
      # Host port is overridable: DB_PORT=5433 docker compose up
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Postgres 18 keeps its data one folder up from 17. (The old Postgres 17
      # volume, yana-restaurant_postgres-data, is left as it was, unused.)
      - postgres18-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      # Host port is overridable: WEB_PORT=3200 docker compose up
      # Defaults to 3100 because another local project already uses 3000.
      - "${WEB_PORT:-3100}:3000"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/yana
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-me}
      - ADMIN_SESSION_SECRET=${ADMIN_SESSION_SECRET:-dev-only-insecure-secret}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - MAIL_REPLY_TO=${MAIL_REPLY_TO:-}
      - MAIL_STAFF_TO=${MAIL_STAFF_TO:-}
      - MAIL_SITE_URL=${MAIL_SITE_URL:-}
      - MAIL_PHONE=${MAIL_PHONE:-}
      # Never send real emails from the local copy: it holds real guests'
      # addresses after npm run sync. Emails are logged instead.
      - MAIL_DRY_RUN=${MAIL_DRY_RUN:-1}
      # Local visits must not show up in the real Google Analytics.
      - NUXT_PUBLIC_GA_MEASUREMENT_ID=

volumes:
  postgres18-data:
